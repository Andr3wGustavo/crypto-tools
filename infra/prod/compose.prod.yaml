# Cortex Farm — production stack (VPS). No published ports: only containers on this network and
# the host (via `docker compose exec`) reach Postgres/Redis; operators come in over Tailscale SSH.
# Workers + dead-man are generated per pair in compose.pairs.yaml (see apps/worker/src/ops/pairs-cli.ts).
#
#   docker compose --env-file /srv/cortex/cortex.env -f compose.prod.yaml -f compose.pairs.yaml up -d --wait
name: cortex-farm

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: cortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /srv/cortex/cortex.env}
      POSTGRES_DB: farm_shadow
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d farm_shadow"]
      interval: 5s
      timeout: 3s
      retries: 30
    shm_size: 256mb
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: "3" }

  redis:
    image: redis:7.4-alpine
    container_name: cortex-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 320m
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  # One-shot schema migration, run by deploy.sh before the workers start (profile: not started by `up`).
  migrate:
    image: ghcr.io/andr3wgustavo/cortex-migrate:${IMAGE_TAG:?set IMAGE_TAG}
    profiles: ["migrate"]
    environment:
      DATABASE_URL: postgresql://cortex:${POSTGRES_PASSWORD}@postgres:5432/farm_shadow
    depends_on:
      postgres: { condition: service_healthy }

  # Operator API — enable with COMPOSE_PROFILES=api in cortex.env once provisioned (docs/runbooks/vps.md).
  # Published on the host loopback only; `tailscale serve` puts HTTPS on the tailnet in front of it.
  # Values default to empty so the file interpolates without them; the API refuses to boot until set.
  api:
    image: ghcr.io/andr3wgustavo/cortex-api:${IMAGE_TAG:?set IMAGE_TAG}
    container_name: cortex-api
    profiles: ["api"]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      API_PORT: "8080"
      API_ORIGIN: ${API_ORIGIN:-}
      API_ALLOWED_WALLETS: ${API_ALLOWED_WALLETS:-}
      API_TOTP_SECRET: ${API_TOTP_SECRET:-}
      API_SERVICE_TOKENS: ${API_SERVICE_TOKENS:-}
      API_TRUST_PROXY: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://cortex:${POSTGRES_PASSWORD}@postgres:5432/farm_shadow?connection_limit=3
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  # Alerter: halts, kills, divergences, dead feeds, drawdown and the daily digest → Discord.
  # Always on: without ALERT_DISCORD_WEBHOOK it only logs (docs/runbooks/vps.md §2c).
  alerter:
    image: ghcr.io/andr3wgustavo/cortex-worker:${IMAGE_TAG:?set IMAGE_TAG}
    container_name: cortex-alerter
    restart: unless-stopped
    command: ["node", "--enable-source-maps", "dist/alerter.js"]
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_URL: redis://redis:6379
      ALERT_DISCORD_WEBHOOK: ${ALERT_DISCORD_WEBHOOK:-}
      ALERTER_HEALTHCHECK_URL: ${ALERTER_HEALTHCHECK_URL:-}
      ALERT_DAILY_UTC_HOUR: ${ALERT_DAILY_UTC_HOUR:-11}
      ALERT_SOURCE: ${ALERT_SOURCE:-cortex-tokyo}
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  # LIVE trading (E8). Never started by default: only with COMPOSE_PROFILES=live, after the GO
  # and the operator's LIVE_ACK. It refuses to boot unless the live gate opens (docs/E8-DESIGN.md).
  live:
    image: ghcr.io/andr3wgustavo/cortex-worker:${IMAGE_TAG:?set IMAGE_TAG}
    container_name: cortex-live
    profiles: ["live"]
    restart: unless-stopped
    command: ["node", "--enable-source-maps", "dist/live.js"]
    stop_grace_period: 30s # the drain cancels every order before exiting
    depends_on:
      redis: { condition: service_healthy }
    environment:
      TRADING_MODE: live
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LIVE_DATA_DIR: /data/live
      HEARTBEAT_DIR: /data/health
      LIVE_REPORT_FILE: /data/live/report.json
      LIVE_SYMBOL: ${LIVE_SYMBOL:-}
      LIVE_ACK: ${LIVE_ACK:-}
      LIVE_CAPITAL_QUOTE: ${LIVE_CAPITAL_QUOTE:-}
      LIVE_CAPITAL_MAX: ${LIVE_CAPITAL_MAX:-15}
      LIVE_KEY_ATTESTED: ${LIVE_KEY_ATTESTED:-}
      LIVE_PAPER_OFFSET_BPS: ${LIVE_PAPER_OFFSET_BPS:-0}
      BOT_REFERENCE_SYMBOL: ${LIVE_REFERENCE_SYMBOL:-}
      MEXC_API_KEY: ${MEXC_API_KEY:-}
      MEXC_API_SECRET: ${MEXC_API_SECRET:-}
      WITHDRAW_ENABLED: "false"
    volumes:
      - ${CORTEX_DATA:-/srv/cortex/data}:/data
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: "5" }

volumes:
  pgdata:
  redisdata:
