name: Deploy (VPS)

# Manual only: a human decides when a new build replaces the running shadow (it restarts every
# worker). The VPS is reached over Tailscale; it has no public SSH. deploy.sh runs the migration,
# rolls the workers, waits for every healthcheck (fresh heartbeat from the NEW version) and rolls
# back to the previous tag automatically if they do not come up.
#
# Required (Settings → Secrets and variables → Actions):
#   secrets.TS_OAUTH_CLIENT_ID, secrets.TS_OAUTH_SECRET  — Tailscale OAuth client (tag:ci)
#   vars.VPS_HOST                                        — Tailscale name of the VPS, e.g. cortex-tokyo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (first 12 chars of a commit that passed CI)
        required: true

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Validate tag
        run: '[[ "${{ inputs.tag }}" =~ ^[0-9a-f]{12}$ ]] || { echo "tag must be 12 hex chars"; exit 1; }'
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy over Tailscale SSH
        run: ssh -o StrictHostKeyChecking=accept-new "cortex@${{ vars.VPS_HOST }}" "/srv/cortex/repo/infra/prod/scripts/deploy.sh ${{ inputs.tag }}"
