name: CI

on:
  push:
    branches: [main, "rebuild/**", "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npx vitest run --coverage
      - name: Validate Prisma schema
        run: npx prisma validate --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: farm_shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cortex -d farm_shadow"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:deploy
        env:
          DATABASE_URL: postgresql://cortex:ci@localhost:5432/farm_shadow
