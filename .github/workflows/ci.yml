name: CI

on:
  push:
    branches: [main, "rebuild/**", "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        # Real Redis for the end-to-end command test (API → stream → worker).
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run web:build
      - run: npx vitest run --coverage
        env:
          REDIS_TEST_URL: redis://localhost:6379
      - name: Validate Prisma schema
        run: npx prisma validate --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  e2e:
    # The dashboard in a real browser (desktop + mobile): Phantom sign-in, every page, the 2FA
    # command flow, no console errors (so no CSP violations), no horizontal scroll.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screens
          path: test-results/
          retention-days: 14

  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: farm_shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cortex -d farm_shadow"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:deploy
        env:
          DATABASE_URL: postgresql://cortex:ci@localhost:5432/farm_shadow
      - name: farm_live and farm_test get the same schema
        env:
          PGPASSWORD: ci
        run: |
          for db in farm_live farm_test; do
            psql -h localhost -U cortex -d farm_shadow -c "CREATE DATABASE $db"
            DATABASE_URL="postgresql://cortex:ci@localhost:5432/$db" npm run db:migrate:deploy
          done
      - name: schema.prisma and the migrations agree (only TimescaleDB's own ts indexes differ)
        run: |
          drift="$(npx prisma migrate diff --from-url postgresql://cortex:ci@localhost:5432/farm_live --to-schema-datamodel packages/db/prisma/schema.prisma --script | grep -vE '^(--.*)?$' | grep -vE '^DROP INDEX "[a-z_]+_ts_idx";$' || true)"
          if [ -n "$drift" ]; then echo "$drift"; exit 1; fi
      - name: persistence against the real database (exactly-once, crash replay, backfill)
        run: npm run db:generate && npx vitest run apps/worker/src/sinks/postgres-sink.db.test.ts
        env:
          TEST_DATABASE_URL: postgresql://cortex:ci@localhost:5432/farm_test

  image:
    # Multi-arch images (arm64 = Oracle Ampere VPS): worker runtime + one-shot migrate.
    # Pushed to GHCR on pushes (tag = first 12 chars of the commit); PRs only build.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [check, migrate, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ steps.v.outputs.tag }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/andr3wgustavo/cortex-worker:${{ steps.v.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          target: api
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ steps.v.outputs.tag }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/andr3wgustavo/cortex-api:${{ steps.v.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          target: migrate
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/andr3wgustavo/cortex-migrate:${{ steps.v.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
